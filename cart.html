<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts used in css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;700&family=Source+Sans+3:wght@40;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="colours.css">
    <link rel="stylesheet" href="styles.css">
    <title>Cart | Cremorne Street Bakers</title>
</head>

<body>
    <nav>
        <div class="nav-content">
            <!-- logo is different alignment from other nav items, so separated -->
            <a href="home.html"><img src="assets/images/CSB.svg" alt="Cremorne Street Bakers" class="nav-logo"></a>
            <div class="nav-items">
                <div class="nav-links">
                    <ul>
                        <li><a href="all_products.html">All products</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li><a href="about.html">About</a></li>
                    </ul>
                </div>
                <!-- search icon first -->
                <a href="search.html" class="nav-icon" aria-label="Search"><img src="assets/icons/search-nav-icon.svg" alt=""></a>
                <!-- cart icon on the very right -->
                <a href="cart.html" class="nav-icon" aria-label="Shopping cart">
                    <img src="assets/icons/cart-nav-icon.svg" alt="">
                    <span class="cart-badge" data-cart-badge>0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="cart-page">
        <a href="search.html" class="back-link"><img src="assets/icons/back-button.svg" alt="Go back"></a>

        <div class="cart-container">
            <h1 class="font-serif cart-main-title">Shopping Cart</h1>
            
            <div class="cart-header-status">
                <span id="cartCountHeader">0 item(s)</span>
                <button type="button" id="clearCartButton" class="btn-edit-clear">Clear all</button>
            </div>

            <p id="cartEmpty" class="product-page-desc" style="padding: 20px 0;">Your cart is empty.</p>

            <div id="cartItemsList" class="cart-items-container"></div>
        </div>

        <div class="cart-footer-wave u-hidden" id="cartSummary">
            <div class="footer-wave-content">
                <div class="summary-line">
                    <span>Shipping</span>
                    <span class="text-right">Calculated at checkout</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-line subtotal-row">
                    <strong>Subtotal</strong>
                    <strong id="cartSubtotal" class="text-right">AUD $0.00</strong>
                </div>
            </div>

            <div class="fulfillment-panel">
                <div class="fulfillment-row">
                    <div class="toggle-group">
                        <button type="button" class="toggle-btn" id="btnDelivery">Delivery</button>
                        <button type="button" class="toggle-btn active" id="btnStorePickup">Store Pickup</button>
                    </div>
                    
                    <div class="datetime-pills">
                        <!-- static dates & times -->
                        <span class="datetime-pill">Apr 1, 2025</span>
                        <span class="datetime-pill">9:41 AM</span>
                    </div>
                </div>

                <div class="cart-nav-actions">
                    <a href="search.html" class="btn-continue-shopping">
                        <img src="assets/icons/cont-shopping-button.svg" alt="Continue Shopping">
                    </a>
                    <a href="checkout.html" class="btn-checkout-forward">
                        <img src="assets/icons/checkout-button.svg" alt="Checkout">
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
