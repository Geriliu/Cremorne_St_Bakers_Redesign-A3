<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts used in css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;700&family=Source+Sans+3:wght@40;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="colours.css">
    <link rel="stylesheet" href="styles.css">
    <title>Product | Cremorne Street Bakers</title>
</head>

<body>
    <nav>
        <div class="nav-content">
            <!-- logo is different alignment from other nav items, so separated -->
            <a href="home.html"><img src="assets/images/CSB.svg" alt="Cremorne Street Bakers" class="nav-logo"></a>
            <div class="nav-items">
                <div class="nav-links">
                    <ul>
                        <li><a href="all_products.html">All products</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li><a href="about.html">About</a></li>
                    </ul>
                </div>
                <!-- search icon first -->
                <a href="search.html" class="nav-icon" aria-label="Search"><img src="assets/icons/search-nav-icon.svg" alt=""></a>
                <!-- cart icon on the very right -->
                <a href="cart.html" class="nav-icon" aria-label="Shopping cart">
                    <img src="assets/icons/cart-nav-icon.svg" alt="">
                    <span class="cart-badge" data-cart-badge>0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="detail-main">
        <a href="search.html" class="back-link"><img src="assets/icons/back-button.svg" alt="Go back"></a>

        <div class="shipping-banner">
            Shipping available up to 20 kms from our Cremorne bakery
        </div>

        <section class="detail-images">
            <img id="mainImage" src="" alt="">
        </section>

        <section class="detail-info">
            <div class="title-row">
                <h1 id="productName"></h1>
                <span id="productPrice"></span>
            </div>

            <p id="productDescription"></p>

            <div class="selector-row">
                <label>SIZE</label>
                <div class="size-options" id="sizeOptions">
                    </div>
                <span id="servingsNote" class="light-text"></span>
            </div>

            <div class="selector-row">
                <label>QTY</label>
                <div class="qty-stepper">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>

            <button class="full-add-button"><img src="assets/icons/full-add-to-cart-button.svg"></button>

            <hr>

            <div class="detail-footer">
                <p><strong>Contains:</strong> <span id="ingredientsList"></span></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
