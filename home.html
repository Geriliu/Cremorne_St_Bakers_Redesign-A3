<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="colours.css">
    <link rel="stylesheet" href="styles.css">
    <title> Bakers Melbourne | Wholesale Bakery | Gourmet Cakes Supplier - Cremorne Street Bakers </title>
</head>

<body class="home-page">
    <nav>
        <div class="nav-content">
            <!-- logo is different alignment from other nav items, so separated -->
            <a href="home.html"><img src="assets/images/CSB.svg" alt="Cremorne Street Bakers Logo" class="nav-logo"></a> 

            <div class="nav-items">
                <!-- search icon first -->
                <a href="search.html" class="nav-icon"><img src="assets/icons/search-nav-icon.svg" alt="Search"></a>
                
                <div class="nav-links">
                    <ul>
                        <li><a href="all_products.html">All Products</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li><a href="about.html">About</a></li>
                    </ul>
                </div>
                
                <!-- cart icon on the very right -->
                <a href="cart.html" class="nav-icon"><img src="assets/icons/cart-nav-icon.svg" alt="Cart"></a>
            </div>
        </div>
        
    </nav>
    
    <!-- <section class="hero">
        <img src="assets/images/home-hero.svg" alt="Cremorne Street Bakers Hero" class="hero-image">
    </section> -->
    
    <main>
        <section class="home-hero-wrap" aria-label="Featured">
            <div class="home-hero-inner">
                <div class="home-hero-headline">
                    <h1>Everyone wants a slice of Delicious</h1>
                    <a class="btn-pink" href="search.html?q=cake">Shop now <span aria-hidden="true">→</span></a>
                </div>
            </div>
        </section>

        <section class="cremie-panel" id="cremie" aria-label="Cremie, your GenAI assistant">
            <img src="assets/icons/just-cremie.svg" width="400" height="200" alt="Cremie assistant">

            <div class="cremie-card">
                <div class="cremie-pills">
                    <button type="button" class="cremie-pill" data-cremie-pill="berry">Something with berry</button>
                    <button type="button" class="cremie-pill" data-cremie-pill="bestsellers">Bestselling cakes</button>
                    <button type="button" class="cremie-pill" data-cremie-pill="decorations">Decorations</button>
                </div>

                <!-- currently nothing happens onclick -->
                <form class="cremie-form" id="cremieForm" method="get">  
                    <label for="cremieInput" class="visually-hidden">Ask Cremie</label>
                    <input class="cremie-input" id="cremieInput" name="q" type="search" placeholder="Something with berry?" autocomplete="off">
                    <button type="submit" class="cremie-send" aria-label="Send">
                        <!-- placeholder - haven't imported button yet -->
                    </button>
                </form>

                <div class="cremie-reply cremie-reply--hidden" id="cremieReply" role="status"></div>
            </div>
        </section>
    </main>



    <script src="script.js"></script>
</body>
</html>
