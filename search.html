<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="colours.css">
    <link rel="stylesheet" href="styles.css">
    <title>Search | Cremorne Street Bakers</title>
</head>

<body class="search-body">
    <nav>
        <div class="nav-content">
            <!-- logo is different alignment from other nav items, so separated -->
            <a href="home.html"><img src="assets/images/CSB.svg" alt="Cremorne Street Bakers" class="nav-logo"></a>
            <div class="nav-items">
                <div class="nav-links">
                    <ul>
                        <li><a href="all_products.html">All products</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li><a href="about.html">About</a></li>
                    </ul>
                </div>
                <!-- search icon first -->
                <a href="search.html" class="nav-icon" aria-label="Search"><img src="assets/icons/search-nav-icon.svg" alt=""></a>
                <!-- cart icon on the very right -->
                <a href="cart.html" class="nav-icon" aria-label="Shopping cart">
                    <img src="assets/icons/cart-nav-icon.svg" alt="">
                    <span class="cart-badge" data-cart-badge>0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="search-main">
        <section class="search-hero">
            <div class="search-box">
                <input id="searchInput" type="search" placeholder="Try “Berry Velvet Cake” or “Pom Poms”" autocomplete="off">
                <button id="searchButton" type="button" aria-label="Search">
                    <img src="assets/icons/search-nav-icon.svg" alt="">
                </button>
            </div>

            <div class="search-filters" aria-hidden="true">
                <button type="button" class="filter-pill" tabindex="-1">Price <span>▼</span></button>
                <button type="button" class="filter-pill active" tabindex="-1">In Stock</button>
                <button type="button" class="filter-pill" tabindex="-1">G-Free</button>
                <button type="button" class="filter-pill" tabindex="-1">Event <span>▼</span></button>
            </div>
        </section>

        <section class="product-preview">
            <h2>A peek at our bestsellers…</h2>
            <div class="product-grid" id="productGrid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
